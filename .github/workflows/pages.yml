name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
      - name: Preparar pacote
        shell: pwsh
        run: ./scripts/prepare-deploy.ps1
      - name: Validar funcionalidades e layout no Chrome
        shell: pwsh
        run: ./tests/run-checks.ps1 -SiteRoot ./dist
  deploy:
    needs: validate
    # Ativar depois de habilitar Pages no repositorio.
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
      - name: Preparar arquivos estaticos
        shell: pwsh
        run: ./scripts/prepare-deploy.ps1
      - name: Validar pacote de publicacao
        shell: pwsh
        run: ./tests/project-check.ps1 -SiteRoot ./dist -Published
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
